        function safeEvaluateMath(expr) {
            if (!expr || typeof expr !== 'string') return 0;
            const sanitized = expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/[^0-9+\-*/.]/g, '');
            if (!sanitized) return 0;
            try {
                const tokens = sanitized.match(/(\d+\.?\d*|[\+\-\*\/])/g);
                if (!tokens) return 0;

                let values = [];
                let ops = [];

                let i = 0;
                while (i < tokens.length) {
                    let token = tokens[i];
                    if (!isNaN(parseFloat(token))) {
                        values.push(parseFloat(token));
                    } else if (['*', '/'].includes(token)) {
                        let nextVal = parseFloat(tokens[i + 1]);
                        if (isNaN(nextVal)) break;
                        let prevVal = values.pop();
                        let res = token === '*' ? prevVal * nextVal : (nextVal !== 0 ? prevVal / nextVal : 0);
                        values.push(res);
                        i++;
                    } else if (['+', '-'].includes(token)) {
                        ops.push(token);
                    }
                    i++;
                }

                let result = values[0] || 0;
                for (let j = 0; j < ops.length; j++) {
                    let op = ops[j];
                    let nextVal = values[j + 1];
                    if (nextVal !== undefined) {
                        result = op === '+' ? result + nextVal : result - nextVal;
                    }
                }
                return isNaN(result) || !isFinite(result) ? 0 : result;
            } catch (e) {
                return 0;
            }
        }

--------------------------------

 *Cliente:* ${order.clientName || ''}
 *Arreglo:* ${order.productDescription || ''}
 *Destinatario:* ${order.recipientName || ''} 
 *Fecha Entrega:* ${order.deliveryDate || ''}${timeStr}
--------------------------------
 *Total Arreglo:* $${total.toFixed(2)}
 *Monto Abonado:* $${paid.toFixed(2)}
 *Restante por Pagar:* $${remaining.toFixed(2)}
--------------------------------
*_🌸 PAGO MÓVIL:_*
Banco: ${paymentSettings.bank || 'Venezuela — 0102'}
Tlfn: ${paymentSettings.phone || '0412-5392101'}
C.I: ${paymentSettings.idCard || 'V-32.015.394'}
Tasa: Bs. ${rate.toFixed(2)}
*Monto en Bolívares:* Bs. ${bsAmount.toFixed(2)}

*Por favor envíanos el captura de pago una vez realizado para procesar tu entrega.* 💕`;
        }

            // 2. SUBSCRIPCIÓN A CAMBIOS EN TIEMPO REAL CON SUPABASE REALTIME
            useEffect(() => {
                const channel = supabase
                    .channel('schema-db-changes')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, (payload) => {
                        if (payload.eventType === 'INSERT') {
                            setOrders(prev => [mapOrderFromDB(payload.new), ...prev.filter(o => o.id !== payload.new.id)]);
                        } else if (payload.eventType === 'UPDATE') {
                            setOrders(prev => prev.map(o => o.id === payload.new.id ? mapOrderFromDB(payload.new) : o));
                        } else if (payload.eventType === 'DELETE') {
                            setOrders(prev => prev.filter(o => o.id !== payload.old.id));
                        }
                    })
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'catalog_items' }, (payload) => {

                    .subscribe();

                    supabase.removeChannel(channel);

            useEffect(() => {

            const cartTotalUSD = useMemo(() => {

            const handleQRImageUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = async () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1000;
                        const MAX_HEIGHT = 1000;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.82);

                    };
                };
            };

                const orderToUpdate = orders.find(o => o.id === orderId);
                if (!orderToUpdate) return;

                const nextMap = {
                    'sin_verificar': 'verificado',
                    'verificado': 'sin_pago',
                    'sin_pago': 'sin_verificar'
                };
                const newStatus = nextMap[orderToUpdate.verificationStatus] || 'verificado';

                setOrders(prev => prev.map(o => o.id === orderId ? { ...o, verificationStatus: newStatus } : o));
                await supabase.from('orders').update({ verification_status: newStatus }).eq('id', orderId);
                showToast('Estado de verificación actualizado');
            };

            const handleStatusChange = async (orderId, newStatus) => {
                setOrders(prev => prev.map(o => o.id === orderId ? { ...o, deliveryStatus: newStatus } : o));
                await supabase.from('orders').update({ delivery_status: newStatus }).eq('id', orderId);
                showToast('Estado de entrega actualizado');
            };

            const handleSaveBusinessSettings = async (updated) => {
                setBusinessInfo(updated);
                await supabase.from('business_settings').upsert({
                    id: 1,
                    business_name: updated.name,
                    phone: updated.phone,
                    logo_url: updated.logoUrl,
                    exchange_rate: updated.exchangeRate

                setIsSettingsOpen(false);
                showToast('✅ Datos del negocio actualizados');
            };

            const handlePDFUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (file.type !== 'application/pdf') {
                    showToast('❌ Adjunta un archivo PDF válido');
                    return;
                }

                setPdfFileName(file.name);
                showToast('⏳ Analizando extracto bancario...');

                try {
                    const fileReader = new FileReader();
                    fileReader.onload = async function () {
                        try {
                            const typedarray = new Uint8Array(this.result);
                            const pdf = await pdfjsLib.getDocument({ data: typedarray }).promise;
                            let fullText = "";

                            for (let i = 1; i <= pdf.numPages; i++) {
                                const page = await pdf.getPage(i);
                                const textContent = await page.getTextContent();
                                fullText += textContent.items.map(item => item.str).join(" ") + "\n";
                            }

                            const cleanedText = fullText.replace(/[\,\.]/g, ' ');
                            const refRegex = /\b\d{4,12}\b/g;
                            const foundRefs = Array.from(new Set(cleanedText.match(refRegex) || []));
                            setPdfParsedRefs(foundRefs);

                            let matchedCount = 0;
                            let newlyVerifiedIds = [];

                            const updatedOrdersPromises = orders.map(async (order) => {
                                if (order.paymentRef && order.paymentRef.trim().length >= 4) {
                                    const cleanRef = order.paymentRef.trim();
                                    const isFoundInPdf = foundRefs.some(ref => ref === cleanRef || ref.endsWith(cleanRef));

                                    if (isFoundInPdf && order.verificationStatus !== 'verificado') {
                                        matchedCount++;
                                        newlyVerifiedIds.push(order.id);
                                        await supabase.from('orders').update({ verification_status: 'verificado' }).eq('id', order.id);
                                        return { ...order, verificationStatus: 'verificado' };
                                    }
                                }
                                return order;
                            });

                            const newOrdersList = await Promise.all(updatedOrdersPromises);
                            setOrders(newOrdersList);

                            setReconciliationSummary({
                                totalInPdfRefs: foundRefs.length,
                                matchedCount,
                                newlyVerifiedIds
                            });

                            if (matchedCount > 0) {
                                showToast(`🎉 ¡Conciliación exitosa! ${matchedCount} pagos verificados.`);
                            } else {
                                showToast('ℹ️ No se encontraron nuevas coincidencias no verificadas.');
                            }

                        } catch (pdfErr) {
                            console.error(pdfErr);
                            showToast('❌ Error al procesar el PDF.');
                        }
                    };
                    fileReader.readAsArrayBuffer(file);
                } catch (err) {
                    console.error(err);
                    showToast('❌ Error al leer el archivo PDF.');
                }
            };

            const handleResetPDF = () => {
                setPdfFileName(null);
                setPdfParsedRefs([]);

                if (fileInputRef.current) fileInputRef.current.value = "";
                showToast('🧹 Conciliador reiniciado');

                        (o.productDescription || '').toLowerCase().includes(term) ||
                        (o.clientPhone || '').includes(term) ||
                        (o.paymentRef || '').includes(term) ||
                        (o.id || '').toLowerCase().includes(term);

                    const total = Number(o.totalAmount || 0);
                    const paid = Number(o.paidAmount || 0);

                    if (filterPayment === 'hoy' && o.deliveryDate !== todayStr) return false;
                    if (filterPayment === 'pendientes' && paid >= total) return false;
                    if (filterPayment === 'pagados' && paid < total) return false;

                    if (filterVerification === 'verificado' && o.verificationStatus !== 'verificado') return false;
                    if (filterVerification === 'sin_verificar' && o.verificationStatus !== 'sin_verificar') return false;
                    if (filterVerification === 'sin_pago' && o.verificationStatus !== 'sin_pago') return false;

                    if (filterOccasion !== 'todas' && o.occasion !== filterOccasion) return false;

                    return true;
                });

                return list.sort((a, b) => {

                        const dateB = new Date(b.deliveryDate || b.createdAt || 0).getTime();
                        return sortOrder === 'asc' ? dateA - dateB : dateB - dateA;
                    }
                });

                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 900;
                        const MAX_HEIGHT = 900;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.82);
                        setFormData(prev => ({ ...prev, photoUrl: compressedBase64 }));
                        setIsCompressing(false);
                    };
                };
            };

                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-0.5">Monto Abonado ($)</label>
                                        <input
                                            type="number"
                                            step="0.01"
                                            placeholder="0.00"
                                            value={formData.paidAmount}
                                            onChange={(e) => setFormData({ ...formData, paidAmount: e.target.value })}
                                            className="w-full px-3 py-1.5 rounded-xl border border-slate-200 font-bold text-emerald-700 focus:outline-none focus:border-roseBoutique-400"
                                        />
                                    </div>
                                </div>

                                <div className="p-2 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center text-xs font-bold">
                                    <span className="text-slate-500">Restante por Pagar:</span>
                                    <span className={remaining > 0 ? "text-rose-600 font-black" : "text-emerald-600 font-black"}>
                                        ${remaining.toFixed(2)}
                                    </span>
                                </div>

                                <div className="grid grid-cols-2 gap-2">
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-0.5">Método de Pago</label>
                                        <select
                                            aria-label="Método de Pago"
                                            value={formData.paymentMethod}
                                            onChange={(e) => setFormData({ ...formData, paymentMethod: e.target.value })}
                                            className="w-full px-3 py-1.5 rounded-xl border border-slate-200 font-semibold focus:outline-none focus:border-roseBoutique-400 bg-white"
                                        >
                                            <option value="Pago Móvil">🌸 Pago Móvil</option>
                                            <option value="Efectivo USD">💵 Efectivo USD</option>
                                            <option value="Zelle">🇺🇸 Zelle</option>
                                            <option value="Transferencia BS">🏦 Transferencia BS</option>
                                            <option value="Binance">🟡 Binance / USDT</option>
                                            <option value="Otro">Otro</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-0.5">N° Referencia / Comp.</label>
                                        <input
                                            type="text"
                                            placeholder="Ej: 849201"
                                            value={formData.paymentRef}
                                            onChange={(e) => setFormData({ ...formData, paymentRef: e.target.value })}
                                            className="w-full px-3 py-1.5 rounded-xl border border-slate-200 font-mono font-bold focus:outline-none focus:border-roseBoutique-400"
                                        />
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-2">
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-0.5">Banco / Cuenta Receptor</label>
                                        <input
                                            type="text"
                                            placeholder="Ej: BNC / Venezuela"
                                            value={formData.bankAccount}
                                            onChange={(e) => setFormData({ ...formData, bankAccount: e.target.value })}
                                            className="w-full px-3 py-1.5 rounded-xl border border-slate-200 font-semibold focus:outline-none focus:border-roseBoutique-400"
                                        />
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-0.5">Estado Verificación</label>
                                        <select
                                            aria-label="Estado Verificación"
                                            value={formData.verificationStatus}
                                            onChange={(e) => setFormData({ ...formData, verificationStatus: e.target.value })}
                                            className="w-full px-3 py-1.5 rounded-xl border border-slate-200 font-bold focus:outline-none focus:border-roseBoutique-400 bg-white"
                                        >
                                            <option value="sin_verificar">🟡 Sin Verificar</option>
                                            <option value="verificado">🟢 Verificado en Banco</option>
                                            <option value="sin_pago">🔴 Sin Pago Registrado</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div className="pt-2 flex gap-2">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-bold hover:bg-slate-50 cursor-pointer"
                                >
                                    Cancelar
                                </button>
                                <button
                                    type="submit"
                                    className="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-roseBoutique-600 to-roseBoutique-500 hover:from-roseBoutique-700 hover:to-roseBoutique-600 text-white font-bold shadow-md shadow-roseBoutique-600/20 cursor-pointer"
                                >
                                    Guardar Pedido
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            );
        }

        function SettingsModal({ businessInfo, onSave, onClose }) {
            const [formData, setFormData] = useState({
                name: businessInfo.name || DEFAULT_BUSINESS_NAME,
                phone: businessInfo.phone || '',
                logoUrl: businessInfo.logoUrl || '',
                exchangeRate: businessInfo.exchangeRate || 882.28
            });

            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 400;
                        const MAX_HEIGHT = 400;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.85);
                        setFormData(prev => ({ ...prev, logoUrl: compressedBase64 }));
                    };
                };
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave({
                    ...formData,
                    exchangeRate: parseFloat(formData.exchangeRate) || 882.28
                });
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/60 backdrop-blur-xs">
                    <div className="bg-white rounded-3xl max-w-sm w-full p-4 space-y-4 shadow-2xl border border-roseBoutique-200">
                        <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                            <h3 className="font-bold text-slate-800 text-sm font-serif">Configuración del Negocio</h3>
                            <button onClick={onClose} aria-label="Cerrar modal de configuración" className="text-slate-400 hover:text-slate-600 p-1">
                                <i data-lucide="x" className="w-5 h-5"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-3 text-xs">
                            <div>
                                <label className="block font-bold text-slate-700 mb-0.5">Nombre de la Tienda / Marca</label>
                                <input
                                    type="text"
                                    required
                                    value={formData.name}
                                    onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                                    className="w-full px-3 py-1.5 rounded-xl border border-slate-200 font-semibold"
                                />
                            </div>

                            <div>
                                <label className="block font-bold text-slate-700 mb-0.5">Tasa BCV / Cambio (Bs. por USD)</label>
                                <input
                                    type="number"
                                    step="0.01"
                                    required
                                    value={formData.exchangeRate}
                                    onChange={(e) => setFormData({ ...formData, exchangeRate: e.target.value })}
                                    className="w-full px-3 py-1.5 rounded-xl border border-slate-200 font-bold text-roseBoutique-800"
                                />
                            </div>

                            <div>
                                <label className="block font-bold text-slate-700 mb-0.5">Teléfono de Contacto Tienda</label>
                                <input
                                    type="tel"
                                    inputMode="numeric"
                                    value={formData.phone}
                                    onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                                    className="w-full px-3 py-1.5 rounded-xl border border-slate-200 font-semibold"
                                    placeholder="Ej: 584125392101"
                                />
                            </div>

                            <div>
                                <label className="block font-bold text-slate-700 mb-0.5">Logo de la Tienda</label>
                                <input
                                    type="file"
                                    accept="image/*"
                                    onChange={handleLogoUpload}
                                    className="text-xs font-semibold text-slate-500 file:mr-2 file:py-1 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-roseBoutique-50 file:text-roseBoutique-700"
                                />
                                {formData.logoUrl && (
                                    <img src={formData.logoUrl} alt="Logo Prev" className="mt-2 w-12 h-12 rounded-xl object-cover border border-slate-200" />
                                )}
                            </div>

                            <div className="pt-2 flex gap-2">
                                <button type="button" onClick={onClose} className="flex-1 py-2 rounded-xl border border-slate-200 text-slate-600 font-bold">Cancelar</button>
                                <button type="submit" className="flex-1 py-2 rounded-xl bg-roseBoutique-600 text-white font-bold shadow-xs">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function TicketModal({ order, businessInfo, paymentSettings, onClose, showToast }) {
            const receiptText = useMemo(() => {
                return generateReceiptText(order, paymentSettings, businessInfo.exchangeRate);
            }, [order, paymentSettings, businessInfo.exchangeRate]);

            const handleCopyText = () => {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(receiptText);
                    showToast('📋 Texto de recibo copiado');
                }
            };

            const handleSendWhatsApp = () => {
                const encoded = encodeURIComponent(receiptText);
                const phone = (order.clientPhone || '').replace(/[^0-9]/g, '');
                const url = phone ? `https://wa.me/${phone}?text=${encoded}` : `https://wa.me/?text=${encoded}`;
                window.open(url, '_blank');
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/60 backdrop-blur-xs">
                    <div className="bg-white rounded-3xl max-w-sm w-full p-4 space-y-3 shadow-2xl border border-roseBoutique-200">
                        <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                            <h3 className="font-bold text-slate-800 text-xs uppercase font-serif">Recibo Digital WhatsApp</h3>
                            <button onClick={onClose} aria-label="Cerrar modal de recibo digital" className="text-slate-400 hover:text-slate-600 p-1">
                                <i data-lucide="x" className="w-5 h-5"></i>
                            </button>
                        </div>

                        <div className="bg-slate-900 text-slate-100 font-mono text-xs p-3 rounded-2xl whitespace-pre-wrap max-h-60 overflow-y-auto leading-relaxed border border-slate-800">
                            {receiptText}
                        </div>

                        <div className="space-y-1.5 pt-1">
                            <button
                                onClick={handleSendWhatsApp}
                                className="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-xs cursor-pointer flex items-center justify-center gap-1.5"
                            >
                                <i data-lucide="message-circle" className="w-4 h-4"></i>
                                <span>Enviar por WhatsApp</span>
                            </button>

                            <button
                                onClick={handleCopyText}
                                className="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold border border-slate-200 cursor-pointer flex items-center justify-center gap-1.5"
                            >
                                <i data-lucide="copy" className="w-4 h-4"></i>
                                <span>Copiar Texto</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
