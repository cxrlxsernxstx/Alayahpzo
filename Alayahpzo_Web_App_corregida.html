            pointer-events: none;
            z-index: 0;

            font-family: 'Playfair Display', serif;
        }

            width: 4px;
            height: 4px;

            background: #FAF5F7;

            background: #E8B4BC;

            display: none;
        }

        .lucide-wrap > svg { width: 100%; height: 100%; }

            transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
            touch-action: manipulation;
        }
        .btn-calc:active {
            transform: scale(0.95);
        }
