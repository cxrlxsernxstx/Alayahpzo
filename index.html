        function safeEvaluateMath(expr) {
            if (!expr || typeof expr !== 'string') return 0;
            const cleaned = expr.replace(/×/g, '*').replace(/÷/g, '/');
            try {
                const tokens = cleaned.match(/(-?\d+\.?\d*|[\+\-\*\/])/g);
                if (!tokens) return 0;

                let values = [];
                let ops = [];
                let i = 0;

                while (i < tokens.length) {
                    let token = tokens[i];
                    if (!isNaN(parseFloat(token)) && isFinite(token)) {
                        values.push(parseFloat(token));
                    } else if (['*', '/'].includes(token)) {
                        let nextVal = parseFloat(tokens[i + 1]);
                        if (isNaN(nextVal)) break;
                        let prevVal = values.pop();
                        let res = token === '*' ? prevVal * nextVal : (nextVal !== 0 ? prevVal / nextVal : 0);
                        values.push(res);
                        i++;
                    } else if (['+', '-'].includes(token)) {
                        ops.push(token);
                    }
                    i++;
                }

                let result = values[0] || 0;
                for (let j = 0; j < ops.length; j++) {
                    let op = ops[j];
                    let nextVal = values[j + 1];
                    if (nextVal !== undefined) {
                        result = op === '+' ? result + nextVal : result - nextVal;
                    }
                }
                return isNaN(result) || !isFinite(result) ? 0 : result;
            } catch (e) {
                return 0;
            }
        }

 *${isFullyPaid ? 'ESTADO:' : 'Restante por Pagar:'}* ${isFullyPaid ? 'PEDIDO PAGADO COMPLETO ✅' : `$${remaining.toFixed(2)}`}
--------------------------------
${isFullyPaid ? '*PAGO COMPLETADO - GRACIAS POR PREFERIRNOS* 💕' : `*_🌸 PAGO MÓVIL:_*
Banco: ${paymentSettings.bank || 'Venezolano — 0104'}

                        const MAX_WIDTH = 700;
                        const MAX_HEIGHT = 700;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {

                            let fullText = "";

                                const textContent = await page.getTextContent();
                                fullText += textContent.items.map(item => item.str).join(" ") + "\n";
                            }

                            const cleanedText = fullText.replace(/[\,\.]/g, ' ');
                            const refRegex = /\b\d{4,12}\b/g;

                        const MAX_WIDTH = 700;
                        const MAX_HEIGHT = 700;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {

        function SettingsModal({ businessInfo, onSave, onClose }) {
            const logoInputRef = useRef(null);
            const [formData, setFormData] = useState({ ...businessInfo });

            const handleLogoUpload = (ev) => {
                const file = ev.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 400;
                        const MAX_HEIGHT = 400;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const mimeType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
                        const compressedBase64 = canvas.toDataURL(mimeType, 0.85);
                        setFormData(prev => ({ ...prev, logoUrl: compressedBase64 }));
                    };
                };
                if (logoInputRef.current) logoInputRef.current.value = "";
            };

            return e('div', { className: "fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/60 backdrop-blur-xs" },

                            e('button', { type: "button", onClick: () => setFormData({ ...formData, logoUrl: '' }), className: "py-1 px-2.5 bg-rose-50 text-rose-700 rounded-lg font-bold border border-rose-200 hover:bg-rose-100 transition-all cursor-pointer" }, "Quitar logo")
                        ),
                        e('input', { ref: logoInputRef, type: "file", accept: "image/*", onChange: handleLogoUpload, className: "w-full" })
                    ),
                    e('div', { className: "pt-2 flex gap-2" },

                    )

            );

        function TicketModal({ order, businessInfo, paymentSettings, onClose, showToast, copyToClipboard }) {
            const receiptText = generateReceiptText(order, paymentSettings, businessInfo.exchangeRate);

            let cleanPhone = (order.clientPhone || '').replace(/[^0-9]/g, '');
            if (cleanPhone.startsWith('0')) cleanPhone = '58' + cleanPhone.slice(1);
            if (cleanPhone && !cleanPhone.startsWith('58') && cleanPhone.length === 10) cleanPhone = '58' + cleanPhone;

            const handleSendWhatsApp = () => {
                const encoded = encodeURIComponent(receiptText);
                const url = cleanPhone ? `https://wa.me/${cleanPhone}?text=${encoded}` : `https://wa.me/?text=${encoded}`;
                window.open(url, '_blank');
            };

            return e('div', { className: "fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/60 backdrop-blur-xs" },

                    e('div', { className: "space-y-2 pt-1" },
                        e('button', { onClick: handleSendWhatsApp, className: "w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl flex items-center justify-center gap-2 cursor-pointer" }, e(Icon, { name: "messageCircle", className: "w-4 h-4" }), "Enviar por WhatsApp"),

                    )
