        function safeEvaluateMath(expr) {
            if (!expr || typeof expr !== 'string') return 0;
            const sanitized = expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/[^0-9+\-*/.]/g, '');
            if (!sanitized) return 0;
            try {
                const tokens = sanitized.match(/(\d+\.?\d*|[\+\-\*\/])/g);
                if (!tokens) return 0;

                let values = [];
                let ops = [];

                let i = 0;
                while (i < tokens.length) {
                    let token = tokens[i];
                    if (!isNaN(parseFloat(token))) {
                        values.push(parseFloat(token));
                    } else if (['*', '/'].includes(token)) {
                        let nextVal = parseFloat(tokens[i + 1]);
                        if (isNaN(nextVal)) break;
                        let prevVal = values.pop();
                        let res = token === '*' ? prevVal * nextVal : (nextVal !== 0 ? prevVal / nextVal : 0);
                        values.push(res);
                        i++;
                    } else if (['+', '-'].includes(token)) {
                        ops.push(token);
                    }
                    i++;
                }

                let result = values[0] || 0;
                for (let j = 0; j < ops.length; j++) {
                    let op = ops[j];
                    let nextVal = values[j + 1];
                    if (nextVal !== undefined) {
                        result = op === '+' ? result + nextVal : result - nextVal;
                    }
                }
                return isNaN(result) || !isFinite(result) ? 0 : result;
            } catch (e) {
                return 0;
            }
        }

--------------------------------
 *Pedido:* #${order.id}
 *Cliente:* ${order.clientName || ''}
 *Arreglo:* ${order.productDescription || ''}
 *Destinatario:* ${order.recipientName || ''} 
 *Fecha Entrega:* ${order.deliveryDate || ''}${timeStr}
--------------------------------
 *Total Arreglo:* $${total.toFixed(2)}
 *Monto Abonado:* $${paid.toFixed(2)}
 *Restante por Pagar:* $${remaining.toFixed(2)}
--------------------------------
*_🌸 PAGO MÓVIL:_*
Banco: ${paymentSettings.bank || 'Venezuela — 0102'}
Tlfn: ${paymentSettings.phone || '0412-5392101'}
C.I: ${paymentSettings.idCard || 'V-32.015.394'}
Tasa: Bs. ${rate.toFixed(2)}
*Monto en Bolívares:* Bs. ${bsAmount.toFixed(2)}

*Por favor envíanos el captura de pago una vez realizado para procesar tu entrega.* 💕`;
        }

            const [showFullscreenQR, setShowFullscreenQR] = useState(false);

            const [searchTerm, setSearchTerm] = useState('');

            const [filterVerification, setFilterVerification] = useState('todas');
            const [filterOccasion, setFilterOccasion] = useState('todas');
            
            const [sortBy, setSortBy] = useState('date');
            const [sortOrder, setSortOrder] = useState('desc');
            
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [editingOrder, setEditingOrder] = useState(null);
            const [initialCalcAmount, setInitialCalcAmount] = useState(null);
            const [ticketOrder, setTicketOrder] = useState(null);
            const [imagePreviewUrl, setImagePreviewUrl] = useState(null);
            const [confirmDeleteId, setConfirmDeleteId] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);

            const [pdfFileName, setPdfFileName] = useState(null);
            const [pdfParsedRefs, setPdfParsedRefs] = useState([]);
            const [reconciliationSummary, setReconciliationSummary] = useState(null);
            const fileInputRef = useRef(null);
            const qrFileInputRef = useRef(null);
            const toastTimerRef = useRef(null);

            const showToast = useCallback((msg) => {
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                setToastMessage(msg);
                toastTimerRef.current = setTimeout(() => {
                    setToastMessage(null);
                    toastTimerRef.current = null;

            }, []);

            // -------------------------------------------------------------
            // LECTURA INICIAL Y REALTIME DESDE SUPABASE
            // -------------------------------------------------------------

                const fetchAllData = async () => {
                    setIsLoading(true);
                    try {
                        // 1. Obtener Pedidos
                        const { data: dbOrders, error: ordersErr } = await supabase
                            .from('orders')
                            .select('*')
                            .order('created_at', { ascending: false });

                        if (ordersErr) throw ordersErr;
                        if (dbOrders) {
                            setOrders(dbOrders.map(mapOrderFromDB));
                        }

                        // 2. Obtener Catálogo
                        const { data: dbCatalog, error: catErr } = await supabase
                            .from('catalog')

                        if (dbCatalog && dbCatalog.length > 0) {

                        } else {

                            setCatalog(INITIAL_CATALOG);
                        }

                        // 3. Obtener Configuración del Negocio y Pago
                        const { data: dbConfig, error: cfgErr } = await supabase
                            .from('settings')
                            .select('*');

                        if (cfgErr) throw cfgErr;

                        setCatalog(INITIAL_CATALOG);
                        setPaymentSettings(INITIAL_PAYMENT_DATA);
                    } finally {
                        setIsLoading(false);
                    }
                };

                fetchAllData();

                // Configuración de Realtime con Supabase Subscriptions
                const ordersSubscription = supabase
                    .channel('public:orders')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, (payload) => {
                        if (payload.eventType === 'INSERT') {
                            const newOrd = mapOrderFromDB(payload.new);
                            setOrders(prev => [newOrd, ...prev.filter(o => o.id !== newOrd.id)]);
                        } else if (payload.eventType === 'UPDATE') {
                            const updatedOrd = mapOrderFromDB(payload.new);
                            setOrders(prev => prev.map(o => o.id === updatedOrd.id ? updatedOrd : o));
                        } else if (payload.eventType === 'DELETE') {
                            setOrders(prev => prev.filter(o => o.id !== payload.old.id));
                        }
                    })
                    .subscribe();

                return () => {
                    supabase.removeChannel(ordersSubscription);
                };
            }, [showToast]);

            useEffect(() => {
                const timer = setTimeout(() => {
                    if (window.lucide && typeof window.lucide.createIcons === 'function') {

                return () => clearTimeout(timer);
            }, [activeTab, calcSubTab, orders, catalog, isModalOpen, isSettingsOpen, ticketOrder, confirmDeleteId, showFullscreenQR, paymentSettings, sortBy, sortOrder, isLoading]);

            const cartTotalUSD = useMemo(() => {
                return calcCart.reduce((sum, item) => sum + item.price, 0);
            }, [calcCart]);

            const evaluatedUsd = useMemo(() => {
                let base = cartTotalUSD;
                if (!calcExpression) return base;
                return base + safeEvaluateMath(calcExpression);
            }, [calcExpression, cartTotalUSD]);

            const evaluatedBs = useMemo(() => {
                return evaluatedUsd * (businessInfo.exchangeRate || 882.28);
            }, [evaluatedUsd, businessInfo.exchangeRate]);

            const handleQRImageUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = async () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1000;
                        const MAX_HEIGHT = 1000;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.82);
                        const updated = { ...paymentSettings, qrImageUrl: compressedBase64 };
                        setPaymentSettings(updated);

                        // Guardar en Supabase
                        try {
                            await supabase.from('settings').upsert({ id: 'payment_settings', value: updated });

                        } catch (err) {
                            showToast('❌ Error guardando QR en la nube');
                        }
                    };
                };
            };

                if (key === 'C') {
                    setCalcExpression('');

                const todayStr = new Date().toISOString().split('T')[0];
                let totalSales = 0;
                let totalCollected = 0;
                let verifiedCount = 0;
                let unverifiedCount = 0;
                let todayDeliveriesCount = 0;

                orders.forEach(o => {
                    const total = Number(o.totalAmount || 0);
                    const paid = Number(o.paidAmount || 0);
                    totalSales += total;
                    totalCollected += paid;

                    if (o.verificationStatus === 'verificado') verifiedCount++;
                    if (o.verificationStatus === 'sin_verificar') unverifiedCount++;
                    if (o.deliveryDate === todayStr) todayDeliveriesCount++;

                return {
                    totalSales,
                    totalCollected,
                    totalPending: Math.max(0, totalSales - totalCollected),
                    verifiedCount,
                    unverifiedCount,
                    todayDeliveriesCount

            const handleExportCSV = () => {

                        verificationStatus: initialVerification,
                        id: `ORD-${Math.floor(1000 + Math.random() * 9000)}`,
                        createdAt: new Date().toISOString()
                    };

                    // UI Optimista
                    setOrders(prev => [newOrder, ...prev]);

                    try {
                        const { error } = await supabase
                            .from('orders')
                            .insert(mapOrderToDB(newOrder));

                        if (error) throw error;
                        showToast('🌸 Pedido guardado en la nube');
                    } catch (err) {
                        console.error(err);
                        showToast('❌ Error al guardar en Supabase');
                    }
                }

                setSyncing(false);
                setIsModalOpen(false);
                setEditingOrder(null);
                setInitialCalcAmount(null);
            };

            const handleDeleteOrder = async (id) => {
                setOrders(prev => prev.filter(o => o.id !== id));
                setConfirmDeleteId(null);

                try {
                    const { error } = await supabase.from('orders').delete().eq('id', id);
                    if (error) throw error;
                    showToast('🗑️ Pedido eliminado de Supabase');
                } catch (err) {
                    console.error(err);
                    showToast('❌ Error al eliminar pedido en Supabase');
                }
            };

            const handleToggleVerification = async (orderId) => {
                const target = orders.find(o => o.id === orderId);
                if (!target) return;

                const nextMap = {
                    'sin_verificar': 'verificado',
                    'verificado': 'sin_pago',
                    'sin_pago': 'sin_verificar'
                };
                const nextStatus = nextMap[target.verificationStatus] || 'verificado';

                setOrders(prev => prev.map(o => o.id === orderId ? { ...o, verificationStatus: nextStatus } : o));

                try {
                    const { error } = await supabase
                        .from('orders')
                        .update({ verification_status: nextStatus })
                        .eq('id', orderId);

                    if (error) throw error;
                    showToast('🟢 Verificación sincronizada con la nube');
                } catch (err) {
                    console.error(err);
                    showToast('❌ Error al actualizar conciliación');
                }
            };

            const handleStatusChange = async (orderId, newStatus) => {

                    showToast('❌ Error al guardar datos');
                }

            const handlePDFUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (file.type !== 'application/pdf') {
                    showToast('❌ Adjunta un archivo PDF válido');
                    return;
                }

                setPdfFileName(file.name);
                showToast('⏳ Analizando extracto bancario...');

                try {
                    const fileReader = new FileReader();
                    fileReader.onload = async function () {
                        try {
                            const typedarray = new Uint8Array(this.result);
                            const pdf = await pdfjsLib.getDocument({ data: typedarray }).promise;
                            let fullText = "";

                            for (let i = 1; i <= pdf.numPages; i++) {
                                const page = await pdf.getPage(i);
                                const textContent = await page.getTextContent();
                                fullText += textContent.items.map(item => item.str).join(" ") + "\n";
                            }

                            const cleanedText = fullText.replace(/[\,\.]/g, ' ');
                            const refRegex = /\b\d{4,12}\b/g;
                            const foundRefs = Array.from(new Set(cleanedText.match(refRegex) || []));
                            setPdfParsedRefs(foundRefs);

                            let matchedCount = 0;
                            let newlyVerifiedIds = [];

                            // Actualizar local y en Supabase
                            const updatedOrders = orders.map(order => {
                                if (order.paymentRef && order.paymentRef.trim().length >= 4) {
                                    const cleanRef = order.paymentRef.trim();
                                    const isFoundInPdf = foundRefs.some(ref => ref === cleanRef || ref.endsWith(cleanRef));

                                    if (isFoundInPdf && order.verificationStatus !== 'verificado') {
                                        matchedCount++;
                                        newlyVerifiedIds.push(order.id);
                                        return { ...order, verificationStatus: 'verificado' };
                                    }
                                }
                                return order;
                            });

                            setOrders(updatedOrders);

                            if (newlyVerifiedIds.length > 0) {
                                // Escribir lote verificado en Supabase
                                await supabase
                                    .from('orders')
                                    .update({ verification_status: 'verificado' })
                                    .in('id', newlyVerifiedIds);
                            }

                            setReconciliationSummary({
                                totalInPdfRefs: foundRefs.length,
                                matchedCount,
                                newlyVerifiedIds
                            });

                            if (matchedCount > 0) {
                                showToast(`🎉 ¡Conciliación exitosa! ${matchedCount} pagos verificados en la nube.`);
                            } else {
                                showToast('ℹ️ No se encontraron nuevas coincidencias no verificadas.');
                            }

                        } catch (pdfErr) {
                            console.error(pdfErr);
                            showToast('❌ Error al procesar el PDF.');
                        }
                    };
                    fileReader.readAsArrayBuffer(file);
                } catch (err) {
                    console.error(err);
                    showToast('❌ Error al leer el archivo PDF.');
                }
            };

                        (o.paymentRef || '').includes(term) ||

                    if (filterVerification === 'sin_pago' && o.verificationStatus !== 'sin_pago') return false;

                    return true;
                });

                        return sortOrder === 'asc' ? dateA - dateB : dateB - dateA;

                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 900;
                        const MAX_HEIGHT = 900;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.82);
                        setFormData(prev => ({ ...prev, photoUrl: compressedBase64 }));
                        setIsCompressing(false);

                                            value={formData.totalAmount}
                                            onChange={(e) => setFormData({ ...formData, totalAmount: e.target.value })}
                                            className="w-full px-3 py-1.5 rounded-xl border border-roseBoutique-300 font-bold focus:outline-none text-roseBoutique-800"
                                        />
                                    </div>

                                    <div>
                                        <label className="block font-bold text-slate-700 mb-0.5">Monto Pagado / Abono ($)</label>
                                        <input
                                            type="number"
                                            step="0.01"
                                            placeholder="0.00"
                                            value={formData.paidAmount}
                                            onChange={(e) => setFormData({ ...formData, paidAmount: e.target.value })}
                                            className="w-full px-3 py-1.5 rounded-xl border border-roseBoutique-300 font-bold focus:outline-none text-emerald-700"
                                        />
                                    </div>
                                </div>

                                {total > 0 && (
                                    <div className="text-xs font-bold text-slate-600 flex justify-between bg-white/90 px-2.5 py-1 rounded-xl border border-roseBoutique-100">
                                        <span>Saldo Restante:</span>
                                        <span className={remaining > 0 ? 'text-amber-600' : 'text-emerald-600'}>
                                            ${remaining.toFixed(2)}
                                        </span>
                                    </div>
                                )}

                                <div className="grid grid-cols-2 gap-2 pt-1">
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-0.5">Nro. de Referencia</label>
                                        <input
                                            type="text"
                                            placeholder="Ej: 884920"
                                            value={formData.paymentRef}
                                            onChange={(e) => setFormData({ ...formData, paymentRef: e.target.value })}
                                            className="w-full px-3 py-1.5 rounded-xl border border-slate-200 font-mono font-bold focus:outline-none"
                                        />
                                    </div>

                                    <div>
                                        <label className="block font-bold text-slate-700 mb-0.5">Método de Pago</label>
                                        <select
                                            aria-label="Método de Pago"
                                            value={formData.paymentMethod}
                                            onChange={(e) => setFormData({ ...formData, paymentMethod: e.target.value })}
                                            className="w-full px-3 py-1.5 rounded-xl border border-slate-200 font-semibold cursor-pointer"
                                        >
                                            <option value="Pago Móvil">Pago Móvil</option>
                                            <option value="Transferencia">Transferencia</option>
                                            <option value="Zelle">Zelle</option>
                                            <option value="Efectivo $">Efectivo $</option>
                                            <option value="Binance Pay">Binance Pay</option>
                                            <option value="Punto de Venta">Punto de Venta</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-2">
                                    <div>
                                        <label className="block font-bold text-slate-700 mb-0.5">Banco Recepción</label>
                                        <input
                                            type="text"
                                            placeholder="Ej: Venezuela — 0102"
                                            value={formData.bankAccount}
                                            onChange={(e) => setFormData({ ...formData, bankAccount: e.target.value })}
                                            className="w-full px-3 py-1.5 rounded-xl border border-slate-200 focus:outline-none"
                                        />
                                    </div>

                                    <div>
                                        <label className="block font-bold text-slate-700 mb-0.5">Estado Conciliación</label>
                                        <select
                                            aria-label="Estado Conciliación"
                                            value={formData.verificationStatus}
                                            onChange={(e) => setFormData({ ...formData, verificationStatus: e.target.value })}
                                            className="w-full px-3 py-1.5 rounded-xl border border-slate-200 font-bold cursor-pointer"
                                        >
                                            <option value="sin_verificar">🟡 Sin Verificar</option>
                                            <option value="verificado">🟢 Pago Verificado</option>
                                            <option value="sin_pago">🔴 Sin Pago / Pendiente</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-slate-50/80 p-3 rounded-2xl border border-slate-100 space-y-2">
                                <span className="text-xs font-black text-roseBoutique-600 uppercase block">📸 Foto del Arreglo</span>
                                <div className="flex items-center gap-3">
                                    {formData.photoUrl && (
                                        <img src={formData.photoUrl} alt="Preview" className="w-12 h-12 rounded-xl object-cover border border-slate-300" />
                                    )}
                                    <label className="flex-1 cursor-pointer bg-white border border-dashed border-slate-300 hover:border-roseBoutique-400 p-2.5 rounded-xl text-center font-bold text-slate-600">
                                        {isCompressing ? 'Procesando foto...' : formData.photoUrl ? 'Cambiar Foto' : 'Adjuntar Foto / Captura'}
                                        <input type="file" accept="image/*" onChange={handlePhotoUpload} className="hidden" />
                                    </label>
                                </div>
                            </div>

                            <div className="pt-2">
                                <button
                                    type="submit"
                                    className="w-full py-3 bg-gradient-to-r from-roseBoutique-700 to-roseBoutique-600 hover:from-roseBoutique-800 hover:to-roseBoutique-700 text-white font-black text-xs rounded-2xl shadow-lg shadow-roseBoutique-600/30 transition-all cursor-pointer"
                                >
                                    Guardar en Supabase Cloud
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            );
        }

        function SettingsModal({ businessInfo, onSave, onClose }) {
            const [formData, setFormData] = useState({ ...businessInfo });

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave({
                    ...formData,
                    exchangeRate: parseFloat(formData.exchangeRate) || 882.28
                });
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/60 backdrop-blur-xs">
                    <div className="bg-white rounded-3xl max-w-sm w-full p-4 space-y-3.5 shadow-2xl border border-roseBoutique-200">
                        <div className="flex justify-between items-center border-b border-slate-100 pb-2">
                            <h3 className="font-bold text-slate-800 text-xs uppercase font-serif">Configuración del Negocio</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 cursor-pointer">
                                <i data-lucide="x" className="w-4 h-4"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-3 text-xs">
                            <div>
                                <label className="block font-bold text-slate-700 mb-0.5">Nombre de la Tienda</label>
                                <input
                                    type="text"
                                    value={formData.name}
                                    onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                                    className="w-full px-3 py-1.5 rounded-xl border border-slate-200 font-semibold"
                                />
                            </div>

                            <div>
                                <label className="block font-bold text-slate-700 mb-0.5">Tasa de Cambio BCV (Bs. / USD)</label>
                                <input
                                    type="number"
                                    step="0.01"
                                    value={formData.exchangeRate}
                                    onChange={(e) => setFormData({ ...formData, exchangeRate: e.target.value })}
                                    className="w-full px-3 py-1.5 rounded-xl border border-slate-200 font-bold text-roseBoutique-800"
                                />
                            </div>

                            <div>
                                <label className="block font-bold text-slate-700 mb-0.5">Teléfono Negocio (WhatsApp)</label>
                                <input
                                    type="text"
                                    value={formData.phone}
                                    onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                                    className="w-full px-3 py-1.5 rounded-xl border border-slate-200 font-semibold"
                                />
                            </div>

                            <div className="pt-2 flex gap-2">
                                <button type="button" onClick={onClose} className="flex-1 py-2 rounded-xl border border-slate-200 font-bold text-slate-600 cursor-pointer">
                                    Cancelar
                                </button>
                                <button type="submit" className="flex-1 py-2 bg-roseBoutique-600 text-white rounded-xl font-extrabold shadow-md hover:bg-roseBoutique-700 cursor-pointer">
                                    Guardar en Nube
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function TicketModal({ order, businessInfo, paymentSettings, onClose, showToast }) {
            const receiptText = generateReceiptText(order, paymentSettings, businessInfo.exchangeRate);

            const handleCopyText = () => {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(receiptText);
                    showToast('📋 Recibo copiado al portapapeles');
                }
            };

            const handleSendWhatsApp = () => {
                const cleanPhone = (order.clientPhone || '').replace(/[^0-9]/g, '');
                const encodedMsg = encodeURIComponent(receiptText);
                if (cleanPhone) {
                    window.open(`https://wa.me/${cleanPhone}?text=${encodedMsg}`, '_blank');
                } else {
                    window.open(`https://wa.me/?text=${encodedMsg}`, '_blank');
                }
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/60 backdrop-blur-xs">
                    <div className="bg-white rounded-3xl max-w-sm w-full p-4 space-y-3 shadow-2xl border border-roseBoutique-200">
                        <div className="flex justify-between items-center border-b border-slate-100 pb-2">
                            <h3 className="font-bold text-slate-800 text-xs uppercase font-serif">Recibo de Pedido #{order.id}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 cursor-pointer">
                                <i data-lucide="x" className="w-4 h-4"></i>
                            </button>
                        </div>

                        <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200/80 font-mono text-[11px] whitespace-pre-wrap leading-relaxed text-slate-800 max-h-60 overflow-y-auto">
                            {receiptText}
                        </div>

                        <div className="grid grid-cols-2 gap-2 pt-1">
                            <button
                                onClick={handleCopyText}
                                className="py-2 px-3 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 cursor-pointer"
                            >
                                <i data-lucide="copy" className="w-3.5 h-3.5"></i>
                                Copiar
                            </button>

                            <button
                                onClick={handleSendWhatsApp}
                                className="py-2 px-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-extrabold text-xs flex items-center justify-center gap-1.5 shadow-md shadow-emerald-600/20 cursor-pointer"
                            >
                                <i data-lucide="message-circle" className="w-3.5 h-3.5"></i>
                                Enviar WhatsApp
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
